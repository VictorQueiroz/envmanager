name: Shell tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Zsh on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh mksh
      - name: Run tests in Bash and Zsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          command -v bash
          command -v zsh
          bash --version
          zsh --version
          python3 -m unittest discover -s tests -v
      - name: Check Android system-shell compatibility with mksh
        if: runner.os == 'Linux'
        env:
          TMPDIR: ${{ runner.temp }}
        run: mksh tests/android-system-smoke.sh "$PWD"
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
